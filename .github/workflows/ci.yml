name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache-dependency-path: go.sum
      - run: go mod tidy -diff
      - run: go fmt ./...
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: helm lint charts/godaddy-domain-exporter --set godaddyPat=test-pat
      - run: docker build -t godaddy-domain-exporter:ci .

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          grep -Fx "version: ${VERSION}" charts/godaddy-domain-exporter/Chart.yaml
          grep -Fx "appVersion: ${VERSION}" charts/godaddy-domain-exporter/Chart.yaml
          grep -Fx "  tag: ${VERSION}" charts/godaddy-domain-exporter/values.yaml
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/denopz/godaddy-domain-exporter
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Package Helm chart
        run: helm package charts/godaddy-domain-exporter --destination "${RUNNER_TEMP}"
      - name: Ensure GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes --latest
          fi
      - name: Upload Helm chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/godaddy-domain-exporter-${GITHUB_REF_NAME#v}.tgz" --clobber
